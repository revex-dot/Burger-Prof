name: pawsitive_cat
description: "Pawsitive Cat – learn cat behavior, train with positive reinforcement, and support animals in need."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Firebase (auth, realtime DB, storage, push, cloud functions)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  cloud_functions: ^5.1.5

  # Payments
  flutter_stripe: ^11.2.0

  # Device / platform
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

  # UI
  fl_chart: ^0.69.0
  intl: any
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/images/
