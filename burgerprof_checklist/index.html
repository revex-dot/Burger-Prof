<title>BurgerProf Feladatlista</title>
<meta name="description" content="Napi nyitó és záró feladatlisták a Burger Prof csapatának: pipálás, fotó, aláírás, vezetői ellenőrzés.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F4F3EF;
    --surface: #FFFFFF;
    --surface-2: #ECEAE4;
    --line: #DAD7CF;
    --ink: #17171A;
    --ink-2: #5C5A55;
    --ink-3: #8E8B84;
    --accent: #F2B705;
    --accent-ink: #1B1500;
    --accent-soft: #FBEBB5;
    --done: #1F8A4C;
    --done-soft: #DDF2E5;
    --warn: #B7791F;
    --warn-soft: #FBEFD6;
    --danger: #C8321E;
    --danger-soft: #F8DDD8;
    --shadow: 0 1px 2px rgba(23,23,26,.06), 0 6px 20px rgba(23,23,26,.06);
    --radius: 10px;
    --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141311; --surface: #1F1D1A; --surface-2: #2A2724; --line: #3A3631;
      --ink: #F3EFE7; --ink-2: #BDB7AC; --ink-3: #85807A;
      --accent: #F2B705; --accent-ink: #1B1500; --accent-soft: #4A3A06;
      --done: #4FCB80; --done-soft: #17392A; --warn: #E3A43A; --warn-soft: #3E2E12;
      --danger: #F0705C; --danger-soft: #4A1F19;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #141311; --surface: #1F1D1A; --surface-2: #2A2724; --line: #3A3631;
    --ink: #F3EFE7; --ink-2: #BDB7AC; --ink-3: #85807A;
    --accent: #F2B705; --accent-ink: #1B1500; --accent-soft: #4A3A06;
    --done: #4FCB80; --done-soft: #17392A; --warn: #E3A43A; --warn-soft: #3E2E12;
    --danger: #F0705C; --danger-soft: #4A1F19;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-body); font-size: 16px; line-height: 1.4;
    padding-block: 0 84px; padding-inline: 0;
    min-height: 100vh;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { max-width: 100%; display: block; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; }

  /* Header */
  .top {
    position: sticky; top: 0; z-index: 20; background: var(--ink); color: #F3EFE7;
  }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; }
  .brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
  .brand small { font-weight: 600; color: var(--accent); margin-left: 8px; letter-spacing: .08em; font-size: 14px; }
  .who {
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #F3EFE7;
    border-radius: 999px; padding: 6px 12px 6px 10px; display: flex; align-items: center; gap: 8px;
    font-weight: 600; max-width: 60%; min-width: 0; flex: 0 1 auto;
  }
  .who #whoName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .brand { min-width: 0; overflow: hidden; white-space: nowrap; }
  @media (max-width: 440px) { .brand small { display: none; } }
  .who.empty { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .who .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .who.empty .dot { background: var(--accent-ink); }

  /* Tabs */
  .tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
  .tabs.admin .wrap { grid-template-columns: repeat(5, 1fr); }
  .tab { font-size: 14px; }
  .tabs.admin .tab { font-size: 11px; letter-spacing: .02em; }
  .tabs.admin .tab svg { width: 22px; height: 22px; }
  .tab {
    background: none; border: 0; padding: 10px 4px 8px; color: var(--ink-3);
    font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { color: var(--ink); }
  .tab.active svg { color: var(--accent); }

  /* Generic */
  main { padding-block: 16px; }
  h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; line-height: 1.05; }
  h1 { font-size: 32px; font-weight: 800; }
  h2 { font-size: 22px; font-weight: 700; }
  h3 { font-size: 17px; font-weight: 700; color: var(--ink-2); letter-spacing: .08em; }
  .eyebrow { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .muted { color: var(--ink-2); }
  .small { font-size: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: var(--radius); padding: 12px 16px; font-weight: 600; min-height: 46px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.done { background: var(--done); border-color: var(--done); color: #fff; }
  .btn.danger { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
  .btn.ghost { background: transparent; }
  .btn.block { width: 100%; }
  .btn.sm { padding: 8px 12px; min-height: 36px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 20px; height: 20px; flex: none; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-weight: 600; font-size: 14px; color: var(--ink-2); }
  input[type=text], input[type=password], input[type=date], textarea {
    width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
    padding: 11px 12px; min-height: 46px;
  }
  textarea { min-height: 72px; resize: vertical; }

  /* Home cards */
  .today-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .today-head .date { font-family: var(--font-display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
  .list-card {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
    width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 14px 14px 16px; box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .list-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--line); }
  .list-card.state-partial::before { background: var(--accent); }
  .list-card.state-done::before { background: var(--done); }
  .list-card .name { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
  .list-card .sub { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
  .list-card .prog { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .ring { width: 52px; height: 52px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .pill.done { background: var(--done-soft); color: var(--done); }
  .pill.partial { background: var(--accent-soft); color: var(--accent-ink); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.danger { background: var(--danger-soft); color: var(--danger); }
  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .bar.full i { background: var(--done); }

  /* Checklist */
  .back { background: none; border: 0; padding: 4px 0; color: var(--ink-2); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px; }
  .back svg { width: 20px; height: 20px; }
  .check-head { margin-bottom: 14px; }
  .check-head .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--ink-2); margin-top: 6px; }
  .items { display: flex; flex-direction: column; gap: 8px; }
  .item {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: start; padding: 10px 10px 10px 8px;
  }
  .item.done { background: var(--done-soft); border-color: transparent; }
  .item .box {
    width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface);
    display: flex; align-items: center; justify-content: center; padding: 0; flex: none;
  }
  .item.done .box { background: var(--done); border-color: var(--done); color: #fff; }
  .item .box svg { width: 26px; height: 26px; }
  .item .body { min-width: 0; padding-top: 2px; }
  .item .text { font-weight: 500; line-height: 1.3; }
  .item.done .text { color: var(--ink-2); }
  .item .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--ink-2); }
  .item .meta b { color: var(--ink); font-weight: 600; }
  .tag { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-ink); }
  .item .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .cam {
    width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    display: flex; align-items: center; justify-content: center; color: var(--ink-2); padding: 0;
  }
  .cam svg { width: 22px; height: 22px; }
  .cam.busy { opacity: .5; }
  .thumb { width: 44px; height: 44px; border-radius: 8px; border: 0; padding: 0; overflow: hidden; background: var(--surface-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .note-btn { background: none; border: 0; color: var(--ink-3); font-size: 13px; padding: 0; text-decoration: underline; }
  .item .note { margin-top: 4px; font-size: 14px; color: var(--ink-2); font-style: italic; }
  .item .text-btn { background: none; border: 0; padding: 0; text-align: left; width: 100%; color: inherit; }

  .who-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; color: var(--ink); max-width: 100%; }
  .who-chip.empty { background: transparent; border-style: dashed; border-color: var(--accent); color: var(--warn); font-weight: 500; }
  .who-chip svg { width: 13px; height: 13px; opacity: .55; flex: none; }
  .who-chip:disabled { opacity: 1; }
  .owner-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; }
  .owner-row.empty { border: 1px dashed var(--accent); background: var(--accent-soft); }
  .owner-row .nm { font-family: var(--font-display); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
  .owner-row .nm.none { font-family: var(--font-body); font-size: 15px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink-2); }
  .mode-note { font-size: 13px; color: var(--ink-2); margin: -4px 0 12px; }
  .chip.sm { min-height: 36px; padding: 6px 12px; font-size: 13px; }

  .section { margin-top: 24px; }
  .section h3 { margin-bottom: 10px; }
  .sigs { display: flex; flex-direction: column; gap: 8px; }
  .sig { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
  .sig img { height: 48px; width: 120px; object-fit: contain; background: #fff; border-radius: 6px; }
  .sig .n { font-weight: 600; }
  .closed-banner { background: var(--done); color: #fff; border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-weight: 600; margin-top: 14px; }
  .closed-banner svg { width: 22px; height: 22px; flex: none; }
  .readonly-banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--radius); padding: 10px 14px; font-weight: 600; margin-bottom: 12px; font-size: 14px; }

  /* History */
  .hist-day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .hist-day .d { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .hist-day .d b { font-family: var(--font-display); font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }
  .hist-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 10px 14px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
  .hist-row:last-child { border-bottom: 0; }
  .hist-row .n { font-weight: 600; }
  .hist-row .s { font-size: 13px; color: var(--ink-2); }

  /* Settings */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip .x { color: var(--ink-3); font-weight: 400; }
  .tpl-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .tpl-item:last-of-type { border-bottom: 0; }
  .tpl-item textarea { min-height: 44px; padding: 8px 10px; }
  .days { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .days .lbl { font-size: 12px; color: var(--ink-3); margin-right: 4px; }
  .day { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 700; padding: 0; color: var(--ink-3); }
  .day.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ico-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .ico-btn svg { width: 18px; height: 18px; }
  .ico-col { display: flex; flex-direction: column; gap: 4px; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
  .modal { background: var(--surface); color: var(--ink); width: 100%; max-width: 640px; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
  @media (min-width: 700px) { .modal-bg { align-items: center; padding: 16px; } .modal { border-radius: 16px; } }
  .modal h2 { margin-bottom: 12px; }
  .sigpad { width: 100%; height: 180px; border: 2px dashed var(--line); border-radius: var(--radius); background: #fff; touch-action: none; display: block; }
  .lightbox img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: var(--radius); background: #000; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #F3EFE7; padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
  .banner { background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; padding: 8px 16px; text-align: center; }
  .empty-state { color: var(--ink-3); text-align: center; padding: 32px 16px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print {
    .top, .tabs, .cam, .back, .btn, .modal-bg, .toast { display: none !important; }
    body { background: #fff; color: #000; padding: 0; }
    .item { break-inside: avoid; }
  }
  /* ---- állapotjelzők, ellenőrzés ---- */
  .item.skipped { background: var(--warn-soft); border-color: transparent; }
  .item.skipped .box { border-color: var(--warn); color: var(--warn); border-style: dashed; }
  .item.skipped .box svg { width: 22px; height: 22px; }
  .item .reason { margin-top: 4px; font-size: 14px; color: var(--warn); font-weight: 500; }
  .badge { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
  .badge.req { background: var(--danger-soft); color: var(--danger); }
  .badge.pho { background: var(--surface-2); color: var(--ink-2); }
  .pill.late { background: var(--danger-soft); color: var(--danger); }

  .alert { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--warn); border-radius: var(--radius); padding: 10px 12px; }
  .alert.bad { border-left-color: var(--danger); }
  .alert.ok { border-left-color: var(--done); }
  .alert .ic { width: 22px; height: 22px; color: var(--warn); }
  .alert.bad .ic { color: var(--danger); }
  .alert .t { display: block; font-weight: 600; line-height: 1.25; }
  .alert .s { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .alert .go { color: var(--ink-3); font-size: 20px; }

  .matrix { width: 100%; border-collapse: separate; border-spacing: 3px; }
  .matrix th { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 0 0 4px; text-align: center; line-height: 1.15; }
  .matrix th.dt { text-align: left; width: 74px; }
  .matrix td.dt { font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .matrix td.dt b { color: var(--ink); font-weight: 600; }
  .mx { width: 100%; height: 36px; border: 0; border-radius: 7px; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .03em; color: var(--ink-2); background: var(--surface-2); display: flex; align-items: center; justify-content: center; gap: 3px; }
  .mx.closed { background: var(--done); color: #fff; }
  .mx.late { background: var(--warn); color: #fff; }
  .mx.unsigned { background: var(--accent); color: var(--accent-ink); }
  .mx.open { background: var(--accent-soft); color: var(--accent-ink); }
  .mx.none { background: var(--danger-soft); color: var(--danger); }
  .mx .dotm { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .75; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .audit-bar { display: flex; gap: 8px; align-items: center; background: var(--ink); color: #F3EFE7; border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; }
  .audit-bar .t { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; flex: 1; }
  .audit-bar .btn { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .audit-bar .btn.ghost { background: transparent; border-color: rgba(255,255,255,.3); color: #F3EFE7; }
  .verd { display: flex; gap: 6px; margin-top: 6px; }
  .vbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 34px; padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .vbtn.ok.on { background: var(--done); border-color: var(--done); color: #fff; }
  .vbtn.bad.on { background: var(--danger); border-color: var(--danger); color: #fff; }

/* ---------- Helyi tároló, ami a db felületét utánozza ---------- */
function makeLocalStore() {
  const KEY = 'bp_local_db';
  const data = ls.get(KEY, {});
  const listeners = new Set();
  const save = () => { ls.set(KEY, data); listeners.forEach(fn => { try { fn(); } catch (e) {} }); };
  const snapOf = (path) => ({ id: path.split('/').pop(), exists: path in data, data: () => (path in data ? JSON.parse(JSON.stringify(data[path])) : undefined), metadata: { fromCache: false, hasPendingWrites: false } });
  const deepMerge = (a, b) => { for (const k of Object.keys(b)) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; };
  const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  function docRef(path) {
    return {
      id: path.split('/').pop(), path,
      async get() { return snapOf(path); },
      async set(body) { data[path] = JSON.parse(JSON.stringify(body)); save(); },
      async update(body) { if (!(path in data)) throw { code: 'invalid_argument', message: 'missing' }; deepMerge(data[path], JSON.parse(JSON.stringify(body))); save(); },
      async delete() { delete data[path]; save(); },
      onSnapshot(next) { const fn = () => next(snapOf(path)); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); },
      collection(sub) { return colRef(path + '/' + sub); },
    };
  }
  function colRef(path, q) {
    q = q || { where: [], orderBy: null, limit: 0 };
    const run = () => {
      const depth = path.split('/').length + 1;
      let docs = Object.keys(data).filter(p => p.startsWith(path + '/') && p.split('/').length === depth).map(p => ({ p, d: data[p] }));
      for (const [f, op, v] of q.where) docs = docs.filter(({ d }) => { const x = d[f]; return op === '==' ? x === v : op === '!=' ? x !== v : op === '<' ? x < v : op === '<=' ? x <= v : op === '>' ? x > v : op === '>=' ? x >= v : op === 'in' ? v.includes(x) : true; });
      if (q.orderBy) { const [f, dir] = q.orderBy; docs.sort((a, b) => cmp(a.d[f], b.d[f]) * (dir === 'desc' ? -1 : 1)); } else docs.sort((a, b) => cmp(a.p, b.p));
      if (q.limit) docs = docs.slice(0, q.limit);
      const arr = docs.map(({ p }) => snapOf(p));
      return { docs: arr, size: arr.length, empty: !arr.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return {
      path,
      where(f, op, v) { return colRef(path, { ...q, where: [...q.where, [f, op, v]] }); },
      orderBy(f, dir) { return colRef(path, { ...q, orderBy: [f, dir || 'asc'] }); },
      limit(n) { return colRef(path, { ...q, limit: n }); },
      async get() { return run(); },
      onSnapshot(next) { const fn = () => next(run()); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); },
      doc(id) { return docRef(path + '/' + (id || uid())); },
      async add(body) { const r = docRef(path + '/' + uid()); await r.set(body); return r; },
    };
  }
  return { doc: docRef, collection: colRef, local: true };
}

function templates() {
  const t = state.templates && state.templates.length ? state.templates : DEFAULT_TEMPLATES;
  return [...t].sort((a, b) => (a.order || 0) - (b.order || 0));
}
function templateById(id) { return templates().find(t => t.id === id) || DEFAULT_TEMPLATES.find(t => t.id === id) || { id, name: id, section: '', items: [] }; }
function staff() { return (state.settings && Array.isArray(state.settings.staff)) ? state.settings.staff : []; }
function itemsForDay(tpl, dateStr) {
  const wd = weekdayOf(dateStr);
  return (tpl.items || []).filter(it => !it.weekly || !it.weekly.length || it.weekly.includes(wd));
}
function defsOf(shift, tpl, dateStr) {
  if (shift && shift.items_def && shift.items_def.length) return shift.items_def;
  return itemsForDay(tpl, dateStr).map(it => ({ id: it.id, text: it.text, weekly: !!(it.weekly && it.weekly.length), required: !!it.required, photo: !!it.photo }));
}
function shiftId(dateStr, tplId) { return `${dateStr}_${tplId}`; }
function isPerItem(tpl, shift) {
  if (shift && typeof shift.perItem === 'boolean') return shift.perItem;
  return !!(tpl && tpl.perItem);
}
function dueOf(tpl, shift) { return (shift && shift.dueBy) || (tpl && tpl.dueBy) || ''; }
function dueDate(dateStr, due) {
  if (!due) return null;
  const [h, m] = due.split(':').map(Number);
  const d = parseYmd(dateStr); d.setHours(h || 0, m || 0, 0, 0); return d;
}
function peopleOf(shift) {
  if (!shift) return [];
  const set = new Set();
  if (shift.owner) set.add(shift.owner);
  Object.values(shift.items || {}).forEach(r => { if (r && (r.done || r.skipped) && r.by) set.add(r.by); });
  (shift.signatures || []).forEach(x => set.add(x.name));
  return [...set];
}

/* Egy lista állapota */
function shiftStats(shift, tpl, dateStr) {
  const defs = defsOf(shift, tpl, dateStr);
  const items = shift && shift.items || {};
  let done = 0, skipped = 0;
  defs.forEach(d => { const r = items[d.id]; if (r && r.done) done++; else if (r && r.skipped) skipped++; });
  const total = defs.length;
  const open = total - done - skipped;
  const signed = !!(shift && shift.signatures && shift.signatures.length);
  const closed = total > 0 && open === 0 && signed;
  const due = dueDate(dateStr, dueOf(tpl, shift));
  const closedAt = shift && shift.closedAt ? new Date(shift.closedAt) : null;
  let late = false;
  if (due) late = closed ? (closedAt ? closedAt > due : false) : (new Date() > due);
  const touched = done + skipped > 0 || signed;
  const code = !touched ? 'none' : closed ? (late ? 'late' : 'closed') : open === 0 ? 'unsigned' : 'open';
  return { total, done, skipped, open, signed, closed, late, code, touched };
}

};

async function ensureShift(dateStr, tplId) {
  const id = shiftId(dateStr, tplId);
  const ref = state.db.doc('shifts/' + id);
  const snap = await ref.get();
  if (snap.exists) return { id, ...snap.data() };
  const tpl = templateById(tplId);
  const body = {
    date: dateStr, templateId: tplId, templateName: tpl.name, section: tpl.section,
    weekday: weekdayOf(dateStr), perItem: !!tpl.perItem, dueBy: tpl.dueBy || '', owner: null,
    items_def: itemsForDay(tpl, dateStr).map(it => ({ id: it.id, text: it.text, weekly: !!(it.weekly && it.weekly.length), required: !!it.required, photo: !!it.photo })),
    items: {}, signatures: [], closedAt: null,
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
  };
  await ref.set(body);
  return { id, ...body };
}
async function patchShift(id, patch) {

/* ---------- Fotók ---------- */
function downscale(file, maxPx, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxPx / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });

async function storePhoto(file, meta) {
  const assets = await getAssets();
  if (assets) {
    try {
      const blob = await downscale(file, 1400, 0.82);
      const r = await assets.upload(blob, { type: 'image/jpeg' });
      return { asset: r.id };
    } catch (e) {
      console.warn('asset upload failed, falling back', e);
      if (e && (e.code === 'not_granted' || e.code === 'capability_disabled')) state.assets = null;
    }
  }
  const small = await downscale(file, 720, 0.7);
  const dataUrl = await blobToDataUrl(small);
  const ref = state.db.collection('photos').doc();
  await ref.set({ ...(meta || {}), dataUrl, at: new Date().toISOString() });
  return { doc: ref.id };
}
function photoUrl(ref) {
  if (!ref) return null;
  if (ref.asset) return '/_blob/' + ref.asset;
  if (ref.doc) {
    if (state.photoCache[ref.doc]) return state.photoCache[ref.doc];
    if (!state.photoCache['__p_' + ref.doc]) {
      state.photoCache['__p_' + ref.doc] = true;
      state.db.doc('photos/' + ref.doc).get().then(s => { if (s.exists) { state.photoCache[ref.doc] = s.data().dataUrl; render(); } });
    }
    return null;
  }
  return null;
}
async function deletePhoto(ref) {
  if (!ref) return;
  try {
    if (ref.asset) { const a = await getAssets(); if (a) await a.delete(ref.asset); }
    if (ref.doc) await state.db.doc('photos/' + ref.doc).delete();
  } catch (e) { console.warn(e); }
}

function ringSvg(done, total, code) {
  const pct = total ? done / total : 0;
  const rr = 20, c = 2 * Math.PI * rr;
  const color = code === 'closed' ? 'var(--done)' : code === 'late' ? 'var(--warn)' : 'var(--accent)';
  return `<svg class="ring" viewBox="0 0 52 52" aria-hidden="true">
    <circle cx="26" cy="26" r="${rr}" fill="none" stroke="var(--surface-2)" stroke-width="6"/>
    <circle cx="26" cy="26" r="${rr}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}" transform="rotate(-90 26 26)"/>
    <text x="26" y="30" text-anchor="middle" font-family="var(--font-display)" font-weight="700" font-size="14" fill="var(--ink)">${done}/${total}</text>
  </svg>`;
}

function renderToday() {
  const today = ymd(new Date());
  const wd = weekdayOf(today);
  const cards = templates().map(tpl => {
    const shift = state.todayShifts[tpl.id];
    const st = shiftStats(shift, tpl, today);
    const cls = st.closed ? 'state-done' : st.touched ? 'state-partial' : '';
    const defs = defsOf(shift, tpl, today);
    const weekly = defs.filter(i => i.weekly).length;
    const people = peopleOf(shift);
    const due = dueOf(tpl, shift);
    let pill;
    if (st.closed) pill = `<span class="pill ${st.late ? 'warn' : 'done'}">${st.late ? 'Kész, de késve' : 'Kész, aláírva'}</span>`;
    else if (st.late) pill = `<span class="pill late">Késésben – ${esc(due)} a határidő</span>`;
    else if (st.open === 0 && st.total) pill = '<span class="pill warn">Aláírás hiányzik</span>';
    else if (st.touched) pill = `<span class="pill partial">Folyamatban – még ${st.open}</span>`;
    else pill = `<span class="pill">Még nem kezdték el${due ? ` · ${esc(due)}-ig` : ''}</span>`;
    const pct = st.total ? (st.done + st.skipped) / st.total : 0;
    const strk = streakOf(tpl.id);
    return `<button class="list-card ${cls}" type="button" data-open="${tpl.id}" data-date="${today}">
      <div>
        <div class="eyebrow">${esc(tpl.section)}</div>
        <div class="name">${esc(tpl.name)}</div>
        <div class="sub">${st.done + st.skipped}/${st.total} feladat${weekly ? ` · ${weekly} heti` : ''}${people.length ? ` · ${esc(people.join(', '))}` : ''}</div>
        <div style="margin-top:8px">${pill}</div>
        ${strk >= 3 ? `<div class="small" style="margin-top:6px;color:var(--warn);font-weight:600">🔥 ${strk} nap zsinórban lezárva</div>` : ''}
      </div>
      <div class="prog">${burgerSvg(pct, 68)}</div>
    </button>`;
  }).join('');
  return `<div class="today-head"><h1>Ma</h1><div class="date">${DAY_NAMES[wd]} · ${longDate(today)}</div></div>
    <div class="stack">${cards}</div>
    ${renderOpsCards()}
    ${renderTeamStrip()}
    ${renderLeaderboard()}
    <p class="muted small" style="margin-top:18px">Minden kipipált feladat egy réteg a burgeren. Ha az egész lista kész és alá van írva, összeáll a burger.</p>`;
}

function renderCheck() {
  const { date, tplId } = state.route;
  const tpl = templateById(tplId);
  const shift = state.openShift;
  const perItem = isPerItem(tpl, shift);
  const defs = defsOf(shift, tpl, date);
  const st = shiftStats(shift, tpl, date);
  const today = ymd(new Date());
  const editable = (date === today || state.isAdmin) && !state.audit;
  const auditing = !!state.audit;
  const wd = weekdayOf(date);
  const owner = (shift && shift.owner) || '';
  const due = dueOf(tpl, shift);
  const pct = st.total ? (st.done + st.skipped) / st.total : 0;
  const lay = layerOf(pct);
  const prevLay = state._layers['c_' + tplId];
  const newLayer = prevLay != null && lay > prevLay ? lay - 1 : null;
  state._layers['c_' + tplId] = lay;

  const rows = defs.map(it => {
    const rec = shift && shift.items ? shift.items[it.id] : null;
    const done = !!(rec && rec.done);
    const skipped = !!(rec && rec.skipped && !done);
    const url = rec && rec.photo ? photoUrl(rec.photo) : null;
    let who = '';
    if (perItem && (done || skipped || (rec && rec.by))) {
      who = `<button class="who-chip" type="button" data-person="${esc(it.id)}" ${editable ? '' : 'disabled'}>${esc((rec && rec.by) || '—')}${editable ? ICON.pen : ''}</button>`;
    } else if (perItem && editable) {
      who = `<button class="who-chip empty" type="button" data-person="${esc(it.id)}">+ Elvégző személy</button>`;
    }
    const v = auditing ? (state.audit.verdicts[it.id] || {}) : null;
    const verdict = auditing ? `<div class="verd">
        <button class="vbtn ok ${v.v === 'ok' ? 'on' : ''}" type="button" data-verdict="${esc(it.id)}:ok">Rendben</button>
        <button class="vbtn bad ${v.v === 'bad' ? 'on' : ''}" type="button" data-verdict="${esc(it.id)}:bad">Kifogás</button>
        ${v.c ? `<span class="small" style="align-self:center;color:var(--danger)">${esc(v.c)}</span>` : ''}
      </div>` : '';
    return `<div class="item ${done ? 'done' : skipped ? 'skipped' : ''}" data-item="${esc(it.id)}">
      <button class="box" type="button" data-toggle="${esc(it.id)}" aria-pressed="${done}" aria-label="${done ? 'Kész' : skipped ? 'Kihagyva' : 'Nincs kész'}: ${esc(it.text)}" ${editable ? '' : 'disabled'}>${done ? ICON.check : skipped ? ICON.minus : ''}</button>
      <div class="body">
        <button class="text-btn" type="button" data-toggle="${esc(it.id)}" ${editable ? '' : 'disabled'}><div class="text">${esc(it.text)}</div></button>
        <div class="meta">
          ${it.weekly ? '<span class="tag">Heti</span>' : ''}
          ${it.required ? '<span class="badge req">Kötelező</span>' : ''}
          ${it.photo ? '<span class="badge pho">Fotó kell</span>' : ''}
          ${who}
          ${done || skipped ? `<span class="num">${hhmm(rec.at)}</span>` : ''}
          ${editable ? `<button class="note-btn" type="button" data-note="${esc(it.id)}">${rec && rec.note ? 'megjegyzés szerkesztése' : 'megjegyzés'}</button>` : ''}
        </div>
        ${skipped && rec.skipReason ? `<div class="reason">Kihagyva: ${esc(rec.skipReason)}</div>` : ''}
        ${rec && rec.note ? `<div class="note">${esc(rec.note)}</div>` : ''}
        ${verdict}
      </div>
      <div class="side">
        ${rec && rec.photo
          ? `<button class="thumb" type="button" data-photo="${esc(it.id)}" aria-label="Fotó megnyitása">${url ? `<img src="${esc(url)}" alt="">` : ''}</button>`
          : (editable ? `<label class="cam" data-camlabel="${esc(it.id)}" aria-label="Fotó készítése">${ICON.camera}<input type="file" accept="image/*" capture="environment" hidden data-cam="${esc(it.id)}"></label>` : '')}
      </div>
    </div>`;
  }).join('');

  const ownerBlock = perItem || auditing ? '' : `<div class="owner-row ${owner ? '' : 'empty'}">
      <div><div class="eyebrow">A nap felelőse</div><div class="nm ${owner ? '' : 'none'}">${owner ? esc(owner) : 'Még nincs kiválasztva'}</div></div>
      ${editable ? `<button class="btn sm ${owner ? '' : 'primary'}" type="button" data-owner>${owner ? 'Csere' : 'Kiválaszt'}</button>` : ''}
    </div>`;

  const auditBar = auditing
    ? `<div class="audit-bar">
        <span class="t">Szúrópróba</span>
        <button class="btn sm ghost" type="button" data-audit-cancel>Mégse</button>
        <button class="btn sm" type="button" data-audit-save>Mentés</button>
      </div>`
    : (state.isAdmin ? `<div class="audit-bar"><span class="t">Vezetői nézet</span><button class="btn sm" type="button" data-audit-start>${ICON.shield} Szúrópróba</button></div>` : '');

  const past = state.audits.filter(a => a.date === date && a.templateId === tplId);
  const pastHtml = state.isAdmin && past.length ? `<div class="section"><h3>Korábbi ellenőrzések</h3><div class="stack">${past.map(a => {
    const bad = Object.entries(a.items || {}).filter(([, x]) => x.v === 'bad');
    return `<div class="audit-rec">
      <div class="hd"><b>${esc(a.by || '—')}</b><span class="small muted num">${shortDate(a.date)} ${hhmm(a.at)}</span></div>
      <div class="small ${bad.length ? '' : 'muted'}" style="margin-top:4px;color:${bad.length ? 'var(--danger)' : ''}">${bad.length ? `${bad.length} kifogás` : 'Minden rendben volt'}</div>
      ${bad.length ? `<ul>${bad.map(([id, x]) => { const d = defs.find(q => q.id === id); return `<li>${esc(d ? d.text : id)}${x.c ? ` — ${esc(x.c)}` : ''}</li>`; }).join('')}</ul>` : ''}
      ${a.note ? `<div class="small" style="margin-top:6px">${esc(a.note)}</div>` : ''}
    </div>`;
  }).join('')}</div></div>` : '';

  const sigs = (shift && shift.signatures || []).map((sg, i) => `<div class="sig">
      <img src="${esc(sg.png)}" alt="Aláírás: ${esc(sg.name)}">
      <div><div class="n">${esc(sg.name)}</div><div class="small muted num">${hhmm(sg.at)}${editable ? ` · <button class="note-btn" type="button" data-delsig="${i}">törlés</button>` : ''}</div></div>
    </div>`).join('');
  const sigHint = perItem ? 'Aki dolgozott a műszakban, írja alá – több aláírás is lehet.' : 'A nap felelőse írja alá, ha minden kész.';

  return `<button class="back" type="button" data-back>${ICON.back} Vissza</button>
    <div class="check-head">
      <div style="display:flex;gap:12px;align-items:flex-start">
      <div style="flex:1;min-width:0">
      <div class="eyebrow">${esc(tpl.section)} · ${DAY_NAMES[wd]}</div>
      <h1>${esc(tpl.name)}</h1>
      </div>
      <div style="flex:none">${burgerSvg(pct, 76, newLayer)}</div>
      </div>
      <div class="meta" style="margin-top:6px"><span class="num">${longDate(date)}</span><span class="num"><b>${st.done}</b> / ${st.total} kész${st.skipped ? ` · ${st.skipped} kihagyva` : ''}</span>${due ? `<span class="num ${st.late && !st.closed ? '' : 'muted'}" style="${st.late && !st.closed ? 'color:var(--danger);font-weight:600' : ''}">${st.late && !st.closed ? 'Késésben, határidő' : 'Határidő'}: ${esc(due)}</span>` : ''}</div>
      <div class="bar ${st.open === 0 && st.total ? 'full' : ''}" style="margin-top:10px"><i style="width:${st.total ? Math.round(100 * (st.done + st.skipped) / st.total) : 0}%"></i></div>
    </div>
    ${auditBar}
    ${editable || auditing ? '' : '<div class="readonly-banner">Korábbi nap – csak megtekinthető.</div>'}
    ${ownerBlock}
    ${perItem && editable ? '<p class="mode-note">Minden feladatnál külön szerepel, ki végezte el. Pipáláskor a saját neved kerül oda, de bármelyiknél átírható.</p>' : ''}
    <div class="items">${rows}</div>
    ${st.closed ? `<div class="closed-banner">${ICON.check} Minden feladat lezárva, a lista alá van írva.</div>` : ''}
    ${auditing ? '' : `<div class="section">
      <div class="row-between"><h3>Aláírás</h3>${editable ? `<button class="btn sm primary" type="button" data-sign>${ICON.pen} Aláírom</button>` : ''}</div>
      ${sigs ? `<div class="sigs">${sigs}</div>` : `<p class="muted small" style="margin:0">${sigHint} Ez helyettesíti a papír aláírását.</p>`}
      ${st.open > 0 && editable ? `<p class="muted small" style="margin-top:10px">Még ${st.open} feladat nincs lezárva – aláírni csak utána lehet.</p>` : ''}
    </div>`}
    ${pastHtml}`;
}

function renderHistory() {
  const byDate = {};
  state.history.forEach(s => { (byDate[s.date] = byDate[s.date] || {})[s.templateId] = s; });
  const today = ymd(new Date());
  const dates = Object.keys(byDate).filter(d => d !== today).sort().reverse();
  if (!dates.length) return `<h1 style="margin-bottom:14px">Előzmények</h1><div class="empty-state">Még nincs korábbi nap. A kitöltött listák itt jelennek meg, dátum szerint.</div>`;
  const tpls = templates();
  const days = dates.map(d => {
    const rows = tpls.map(tpl => {
      const s = byDate[d][tpl.id];
      const st = shiftStats(s, tpl, d);
      const info = STATUS[st.code];
      const cls = st.code === 'closed' ? 'done' : st.code === 'none' ? 'danger' : 'warn';
      const who = peopleOf(s).join(', ');
      return `<button class="hist-row" type="button" data-open="${tpl.id}" data-date="${d}">
        <div><div class="n">${esc(tpl.name)} <span class="muted">· ${esc(tpl.section)}</span></div>${who ? `<div class="s">${esc(who)}</div>` : ''}${st.skipped ? `<div class="s" style="color:var(--warn)">${st.skipped} feladat indoklással kihagyva</div>` : ''}</div>
        <span class="pill ${cls}">${st.code === 'open' ? `${st.done}/${st.total}` : info.label}</span>
      </button>`;
    }).join('');
    return `<div class="hist-day"><div class="d"><b>${DAY_NAMES[weekdayOf(d)]}</b><span class="muted num">${longDate(d)}</span></div>${rows}</div>`;
  }).join('');
  return `<h1 style="margin-bottom:14px">Előzmények</h1><div class="stack">${days}</div><p class="muted small" style="margin-top:16px">Az utolsó 45 nap látszik.</p>`;
}

/* ---------- Ellenőrzés (csak vezetőknek) ---------- */
function shiftMap() {
  const m = {};
  state.history.forEach(s => { (m[s.date] = m[s.date] || {})[s.templateId] = s; });
  const today = ymd(new Date());
  m[today] = m[today] || {};
  Object.values(state.todayShifts).forEach(s => { m[today][s.templateId] = s; });
  return m;
}
function firstUseDate() {
  let first = ymd(new Date());
  state.history.forEach(s => { if (s.date < first) first = s.date; });
  return first;
}
function problemList(days) {
  const m = shiftMap();
  const tpls = templates();
  const today = ymd(new Date());
  const from = firstUseDate();
  const out = [];
  for (let i = 0; i < days; i++) {
    const d = daysAgo(i);
    if (d < from) continue;
    tpls.forEach(tpl => {
      const s = (m[d] || {})[tpl.id];
      const st = shiftStats(s, tpl, d);
      if (st.code === 'none' && (d !== today || st.late)) out.push({ sev: 'bad', date: d, tplId: tpl.id, t: `${tpl.name} – nem töltötték ki`, s: `${DAY_NAMES[weekdayOf(d)]}, ${longDate(d)} · ${tpl.section}` });
      else if (st.code === 'unsigned') out.push({ sev: 'warn', date: d, tplId: tpl.id, t: `${tpl.name} – nincs aláírva`, s: `${longDate(d)} · minden feladat lezárva, de hiányzik az aláírás` });
      else if (st.code === 'open' && d !== today) out.push({ sev: 'bad', date: d, tplId: tpl.id, t: `${tpl.name} – ${st.open} feladat befejezetlen`, s: `${longDate(d)} · ${tpl.section}` });
      else if (st.code === 'open' && st.late) out.push({ sev: 'warn', date: d, tplId: tpl.id, t: `${tpl.name} – késésben`, s: `Határidő: ${dueOf(tpl, s)} · még ${st.open} feladat` });
      if (s && s.items) Object.entries(s.items).forEach(([id, r]) => {
        if (r.skipped && !r.done) {
          const def = defsOf(s, tpl, d).find(x => x.id === id);
          out.push({ sev: 'warn', date: d, tplId: tpl.id, t: `Kihagyva: ${def ? def.text : id}`, s: `${longDate(d)} · ${r.by || '—'} · „${r.skipReason || 'nincs indok'}”` });
        }
      });
    });
  }
  state.audits.filter(a => a.date >= daysAgo(days - 1)).forEach(a => {
    const bad = Object.entries(a.items || {}).filter(([, x]) => x.v === 'bad');
    if (bad.length) out.push({ sev: 'bad', date: a.date, tplId: a.templateId, t: `Ellenőrzés: ${bad.length} kifogás`, s: `${longDate(a.date)} · ${a.templateName || ''} · ${a.by || ''}` });
  });
  return out;
}
function renderAudit() {
  const tpls = templates();
  const m = shiftMap();
  const probs = problemList(8);
  const today = ymd(new Date());

  const alerts = probs.slice(0, 8).map(p => `<button class="alert ${p.sev === 'bad' ? 'bad' : ''}" type="button" data-open="${esc(p.tplId)}" data-date="${esc(p.date)}">
      <span class="ic">${ICON.warn}</span>
      <span><span class="t">${esc(p.t)}</span><span class="s">${esc(p.s)}</span></span>
      <span class="go">›</span>
    </button>`).join('');

  const mFrom = firstUseDate();
  const head = tpls.map(t => `<th>${esc(t.name.replace(' feladatok', '').replace('Esti záró', 'Záró'))}<br><span style="font-weight:400">${esc(t.section)}</span></th>`).join('');
  const rows = [];
  for (let i = 0; i < 14; i++) {
    const d = daysAgo(i);
    const cells = tpls.map(tpl => {
      const s = (m[d] || {})[tpl.id];
      const st = shiftStats(s, tpl, d);
      if (d < mFrom && !st.touched) return '<td><button class="mx" type="button" data-open="' + tpl.id + '" data-date="' + d + '" title="A rendszer indulása előtt">·</button></td>';
      const info = STATUS[st.code];
      const short = { none: '—', open: `${st.done}/${st.total}`, unsigned: 'aláírás', closed: 'kész', late: 'késve' }[st.code];
      const audited = state.audits.some(a => a.date === d && a.templateId === tpl.id);
      return `<td><button class="mx ${info.cls}" type="button" data-open="${tpl.id}" data-date="${d}" title="${esc(info.label)}">${esc(short)}${audited ? '<span class="dotm"></span>' : ''}</button></td>`;
    }).join('');
    rows.push(`<tr><td class="dt">${i === 0 ? '<b>Ma</b>' : `<b>${DAY_SHORT[weekdayOf(d)]}</b> ${shortDate(d)}`}</td>${cells}</tr>`);
  }

  /* statisztika, 30 nap */
  const stat = { lists: {}, skips: {}, people: {} };
  tpls.forEach(t => { stat.lists[t.id] = { name: t.name, days: 0, closed: 0, late: 0 }; });
  const statFrom = firstUseDate();
  for (let i = 1; i <= 30; i++) {
    const d = daysAgo(i);
    if (d < statFrom) continue;
    tpls.forEach(tpl => {
      const s = (m[d] || {})[tpl.id];
      const st = shiftStats(s, tpl, d);
      const L = stat.lists[tpl.id]; L.days++;
      if (st.closed) L.closed++;
      if (st.late) L.late++;
      if (s && s.items) Object.entries(s.items).forEach(([id, r]) => {
        const who = r.by || '—';
        stat.people[who] = stat.people[who] || { done: 0, skip: 0 };
        if (r.done) stat.people[who].done++;
        if (r.skipped && !r.done) {
          stat.people[who].skip++;
          const def = defsOf(s, tpl, d).find(x => x.id === id);
          const key = def ? def.text : id;
          stat.skips[key] = (stat.skips[key] || 0) + 1;
        }
      });
    });
  }
  const listStats = tpls.map(t => {
    const L = stat.lists[t.id];
    const pct = L.days ? Math.round(100 * L.closed / L.days) : 0;
    return `<div class="stat-row"><div><div class="n">${esc(L.name)} <span class="muted small">· ${esc(t.section)}</span></div><div class="minibar"><i style="width:${pct}%"></i></div><div class="small muted">${L.closed}/${L.days} nap lezárva${L.late ? ` · ${L.late} késés` : ''}</div></div><div class="v">${pct}%</div></div>`;
  }).join('');
  const topSkips = Object.entries(stat.skips).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([t, n]) => `<div class="stat-row"><div class="small">${esc(t)}</div><div class="v">${n}×</div></div>`).join('')
    || '<p class="muted small" style="margin:6px 0 0">Nem maradt ki feladat az elmúlt 30 napban.</p>';
  const peopleStats = Object.entries(stat.people).filter(([n]) => n !== '—').sort((a, b) => b[1].done - a[1].done)
    .map(([n, v]) => `<div class="stat-row"><div><div class="n">${esc(n)}</div>${v.skip ? `<div class="small" style="color:var(--warn)">${v.skip} kihagyott feladat</div>` : ''}</div><div class="v">${v.done}</div></div>`).join('')
    || '<p class="muted small" style="margin:6px 0 0">Még nincs adat.</p>';

  return `<h1 style="margin-bottom:6px">Ellenőrzés</h1>
    <p class="muted small" style="margin:0 0 14px">Csak a szerkesztési joggal megosztott vezetők látják ezt a fület.</p>

    <h3 style="margin-bottom:8px">Figyelmet igényel · 8 nap</h3>
    ${alerts ? `<div class="stack">${alerts}</div>${probs.length > 8 ? `<p class="muted small" style="margin-top:8px">+ ${probs.length - 8} további tétel.</p>` : ''}`
      : `<div class="alert ok"><span class="ic" style="color:var(--done)">${ICON.check}</span><span><span class="t">Minden rendben</span><span class="s">Nincs befejezetlen, aláíratlan vagy kihagyott feladat.</span></span><span></span></div>`}

    <div class="section">
      <h3 style="margin-bottom:8px">Napi áttekintő · 14 nap</h3>
      <div style="overflow-x:auto"><table class="matrix"><thead><tr><th class="dt">Nap</th>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>
      <div class="legend">
        <span><i style="background:var(--done)"></i>kész, aláírva</span>
        <span><i style="background:var(--warn)"></i>késve zárva</span>
        <span><i style="background:var(--accent)"></i>nincs aláírva</span>
        <span><i style="background:var(--accent-soft)"></i>folyamatban</span>
        <span><i style="background:var(--danger-soft)"></i>nem töltötték ki</span>
        <span>● = volt szúrópróba</span>
      </div>
      <p class="muted small" style="margin-top:8px">Koppints egy napra a részletekhez, ott indíthatsz szúrópróbát is.</p>
    </div>

    <div class="section">
      <h3 style="margin-bottom:8px">Szúrópróba most</h3>
      <div class="stack">${tpls.map(t => `<button class="btn block" type="button" data-open="${t.id}" data-date="${today}" style="justify-content:space-between">${esc(t.name)} · ${esc(t.section)} <span class="muted">›</span></button>`).join('')}</div>
    </div>

    <div class="section">
      <h3 style="margin-bottom:8px">Teljesítés · 30 nap</h3>
      <div class="card">${listStats}</div>
      <h3 style="margin:16px 0 8px">Leggyakrabban kihagyott feladatok</h3>
      <div class="card">${topSkips}</div>
      <h3 style="margin:16px 0 8px">Elvégzett feladatok személyenként</h3>
      <div class="card">${peopleStats}</div>
    </div>

    <div class="section">
      <h3 style="margin-bottom:8px">Export</h3>
      <button class="btn block" type="button" data-export>${ICON.down2} Utolsó 45 nap letöltése (CSV)</button>
      <p class="muted small" style="margin-top:8px">Táblázatban megnyitható, minden feladat, elvégző, időpont és indok soronként.</p>
    </div>`;
}

      ${tpl.items.map((it, ii) => `<div class="tpl-item">

function signModal() {
  const tpl = templateById(state.route.tplId);
  const shift = state.openShift;
  const defs = defsOf(shift, tpl, state.route.date);
  const items = (shift && shift.items) || {};
  const open = defs.filter(d => { const r = items[d.id]; return !(r && (r.done || r.skipped)); });
  if (open.length) { blockedModal(open); return; }
  const perItem = isPerItem(tpl, shift);
  const go = () => openModal(`<h2>Aláírás</h2>
    <p class="muted small" style="margin:0 0 10px">Írd alá ujjal vagy egérrel a mezőben.</p>
    <div class="field"><label for="sigName">Név</label><input type="text" id="sigName" value="${esc(perItem ? state.who : (shift && shift.owner) || state.who)}"></div>
    <canvas class="sigpad" id="sigpad" style="margin-top:10px" aria-label="Aláírás mező"></canvas>
    <div class="row-between" style="margin-top:12px">
      <button class="btn ghost sm" type="button" id="sigClear">Törlés</button>
      <div style="display:flex;gap:8px"><button class="btn ghost" type="button" data-close2>Mégse</button><button class="btn primary" type="button" id="sigOk">${ICON.pen} Aláírom</button></div>
    </div>`,
    m => {
      m.querySelector('[data-close2]').addEventListener('click', closeModal);
      const c = $('#sigpad', m);
      const dpr = window.devicePixelRatio || 1;
      const rct = c.getBoundingClientRect();
      c.width = Math.round(rct.width * dpr); c.height = Math.round(rct.height * dpr);
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
      let drawing = false, strokes = 0, last = null;
      const pos = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      c.addEventListener('pointerdown', e => { drawing = true; last = pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + 0.1, last.y); ctx.stroke(); strokes++; });
      c.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
      const stop = () => { drawing = false; };
      c.addEventListener('pointerup', stop); c.addEventListener('pointercancel', stop);
      $('#sigClear', m).addEventListener('click', () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore(); strokes = 0; });
      $('#sigOk', m).addEventListener('click', async () => {
        const name = $('#sigName', m).value.trim();
        if (!name) { toast('Add meg a neved.'); return; }
        if (!strokes) { toast('Írd alá a mezőben.'); return; }
        const out = document.createElement('canvas'); out.width = 360; out.height = Math.round(360 * c.height / c.width);
        const ox = out.getContext('2d'); ox.fillStyle = '#fff'; ox.fillRect(0, 0, out.width, out.height); ox.drawImage(c, 0, 0, out.width, out.height);
        const png = out.toDataURL('image/png');
        const sh = await ensureShift(state.route.date, state.route.tplId);
        const sigs = [...(sh.signatures || []), { name, at: new Date().toISOString(), png }];
        const patch = { signatures: sigs };
        if (!sh.closedAt) patch.closedAt = new Date().toISOString();
        await patchShift(sh.id, patch);
        if (!state.who) { state.who = name; ls.set('bp_who', name); }
        closeModal();
        const tplC = templateById(state.route.tplId);
        const strkC = streakOf(state.route.tplId);
        celebrate({ title: 'Megvan!', who: name, streak: strkC >= 2 ? strkC : 0,
          text: `${tplC.name} · ${tplC.section} lezárva és aláírva. Semmi nem maradt nyitva.` });
      });
    });
  if (!state.who && perItem) whoModal(go); else go();
}

/* ---------- Műveletek ---------- */
function photoRequiredMissing(itemId) {
  const tpl = templateById(state.route.tplId);
  const def = defsOf(state.openShift, tpl, state.route.date).find(i => i.id === itemId);
  if (!def || !def.photo) return false;
  const rec = state.openShift && state.openShift.items && state.openShift.items[itemId];
  if (rec && rec.done) return false;
  return !(rec && rec.photo);
}
async function toggleItem(itemId) {
  if (photoRequiredMissing(itemId)) {
    const inp = document.querySelector(`[data-cam="${CSS.escape(itemId)}"]`);
    toast('Ehhez a feladathoz fotó kell.');
    if (inp) inp.click();
    return;
  }
  const tpl = templateById(state.route.tplId);
  const perItem = isPerItem(tpl, state.openShift);
  if (perItem && !state.who) { whoModal(() => toggleItem(itemId)); return; }
  if (!perItem) {
    const owner = state.openShift && state.openShift.owner;
    if (!owner) { ownerModal(() => toggleItem(itemId)); return; }
  }
  const person = perItem ? state.who : (state.openShift && state.openShift.owner);
  const before = shiftStats(state.openShift, tpl, state.route.date);
  await writeItem(itemId, rec => (rec.done || rec.skipped)
    ? { ...rec, done: false, skipped: false, skipReason: null, by: null, at: null }
    : { ...rec, done: true, skipped: false, skipReason: null, by: person, at: new Date().toISOString() });
  const after = shiftStats(state.openShift, tpl, state.route.date);
  const b = before.done + before.skipped, a = after.done + after.skipped;
  if (a > b) { popBox(itemId); tickFeedback(b, a, after.total); }
}
async function onPhoto(itemId, file) {
  if (!file) return;
  const lbl = document.querySelector(`[data-camlabel="${CSS.escape(itemId)}"]`);
  if (lbl) lbl.classList.add('busy');
  toast('Fotó feltöltése…');
  try {
    const shift = await ensureShift(state.route.date, state.route.tplId);
    const ref = await storePhoto(file, { shiftId: shift.id, itemId });
    await writeItem(itemId, rec => ({ ...rec, photo: ref, photoAt: new Date().toISOString(), photoBy: state.who || rec.by || null }));
    toast('Fotó mentve.');
  } catch (e) {
    console.warn(e);
    toast(e && e.code === 'too_large' ? 'Túl nagy a kép.' : 'Nem sikerült a fotó mentése.');
    if (lbl) lbl.classList.remove('busy');
  }
}
function go(route) {
  if (route.tab === 'check') {
    const from = state.route.tab === 'check' ? state.route.from : state.route.tab;
    route.from = from === 'history' || from === 'audit' ? from : 'today';
    subscribeOpenShift(shiftId(route.date, route.tplId));
  } else if (state.unsub.open) { state.unsub.open(); state.unsub.open = null; state.openShift = null; }
  if (route.tab !== 'settings') state.editTemplates = null;
  if (route.tab !== 'check') state.audit = null;
  if (route.tab !== 'recipeEdit') state.editRecipe = null;
  if (route.tab !== 'prepEdit') state.editPrep = null;
  if (route.tab !== 'recipe') state.scale = 1;
  state.route = route;
  window.scrollTo({ top: 0 });
  render();
}
async function exportCsv() {
  const rows = [['Dátum', 'Nap', 'Lista', 'Terület', 'Feladat', 'Állapot', 'Elvégző', 'Időpont', 'Indok / megjegyzés', 'Fotó']];
  const all = [...state.history].sort((a, b) => (a.date < b.date ? 1 : -1));
  all.forEach(s => {
    const tpl = templateById(s.templateId);
    defsOf(s, tpl, s.date).forEach(d => {
      const r = (s.items || {})[d.id] || {};
      rows.push([s.date, DAY_NAMES[weekdayOf(s.date)], s.templateName || tpl.name, s.section || tpl.section, d.text,
        r.done ? 'kész' : r.skipped ? 'kihagyva' : 'nincs kész', r.by || s.owner || '', r.at ? hhmm(r.at) : '',
        r.skipReason || r.note || '', r.photo ? 'van' : '']);
    });
    (s.signatures || []).forEach(sg => rows.push([s.date, DAY_NAMES[weekdayOf(s.date)], s.templateName || tpl.name, s.section || tpl.section, '— ALÁÍRÁS —', 'aláírva', sg.name, hhmm(sg.at), '', '']));
  });
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  let dl = state.downloads;
  if (!dl) { try { dl = state.downloads = await window.claude.use('downloads'); } catch (e) { dl = null; } }
  if (!dl) { toast('A letöltés ebben a nézetben nem érhető el.'); return; }

function fmtQty(n) {

function burgerSvg(pct, size, newLayer) {
  const L = [0.2, 0.4, 0.6, 0.8, 1];
  const on = i => pct >= L[i] - 1e-9;
  /* a még hiányzó rétegek halványan látszanak, hogy a burger alakja végig olvasható legyen */
  const lay = (i, inner) => on(i)
    ? `<g${newLayer === i ? ' class="new"' : ''}>${inner}</g>`
    : `<g opacity=".14">${inner.replace(/fill="#[0-9A-Fa-f]{3,6}"/g, 'fill="currentColor"')}</g>`;
  let drip = 'M13 43 H87 V49 ';
  for (let x = 87; x > 14; x -= 9.25) drip += `L${(x - 4.6).toFixed(1)} 55.5 L${(x - 9.25).toFixed(1)} 49 `;
  drip += 'Z';
  const p = [
    '<path d="M14 62 h72 a6 6 0 0 1 0 12 h-72 a6 6 0 0 1 0 -12 z" fill="#D69A4E"/>',
    lay(0, '<rect x="10" y="50" width="80" height="12" rx="6" fill="#4A2C14"/>'),
    lay(1, `<path d="${drip}" fill="#F2B705"/>`),
    lay(2, '<rect x="10" y="33" width="80" height="12" rx="6" fill="#4A2C14"/>'),
    lay(3, '<path d="M12 34 V30 q9.5 -8 19 0 t19 0 t19 0 t19 0 V34 Z" fill="#8FBF52"/>'),
    lay(4, '<path d="M8 31 a42 25 0 0 1 84 0 z" fill="#E2A45B"/>'
         + '<ellipse cx="36" cy="18" rx="3.4" ry="2.1" fill="#FBEBC8" transform="rotate(-18 36 18)"/>'
         + '<ellipse cx="52" cy="13" rx="3.4" ry="2.1" fill="#FBEBC8"/>'
         + '<ellipse cx="68" cy="19" rx="3.4" ry="2.1" fill="#FBEBC8" transform="rotate(16 68 19)"/>'
         + '<ellipse cx="26" cy="26" rx="3" ry="1.9" fill="#FBEBC8" transform="rotate(-26 26 26)"/>'
         + '<ellipse cx="76" cy="27" rx="3" ry="1.9" fill="#FBEBC8" transform="rotate(24 76 27)"/>'),
  ];
  return `<svg class="burger" width="${size}" height="${Math.round(size * 0.8)}" viewBox="0 0 100 80" style="color:var(--ink-3)" aria-hidden="true">${p.join('')}</svg>`;
}
function layerOf(pct) { return pct >= 1 ? 5 : Math.floor(pct / 0.2); }

function confettiOn(canvas) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
  const colors = ['#F2B705', '#FFFFFF', '#1F8A4C', '#D69A4E', '#C8321E'];
  const parts = Array.from({ length: 90 }, () => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.5, y: H * 0.45 + (Math.random() - 0.5) * 60,
    vx: (Math.random() - 0.5) * 9, vy: -6 - Math.random() * 9,
    w: 5 + Math.random() * 6, h: 3 + Math.random() * 5,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
    col: colors[(Math.random() * colors.length) | 0],
  }));
  let t = 0;
  (function frame() {
    t++;
    ctx.clearRect(0, 0, W, H);
    parts.forEach(q => {
      q.vy += 0.32; q.x += q.vx; q.y += q.vy; q.r += q.vr; q.vx *= 0.99;
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r);
      ctx.globalAlpha = Math.max(0, 1 - t / 150);
      ctx.fillStyle = q.col; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
      ctx.restore();
    });
    if (t < 150 && document.body.contains(canvas)) requestAnimationFrame(frame);
  })();
}

function tickFeedback(before, after, total) {
  if (!total || after <= before) return;
  if (navigator.vibrate) { try { navigator.vibrate(14); } catch (e) {} }
  const p0 = before / total, p1 = after / total;
  const ms = MILESTONES.find(x => p0 < x.at && p1 >= x.at);
  if (ms) toast(ms.msg);
}

function streakOf(tplId) {
  const m = shiftMap();
  const tpl = templateById(tplId);
  let n = 0;
  for (let i = 0; i < 60; i++) {
    const d = daysAgo(i);
    const st = shiftStats((m[d] || {})[tplId], tpl, d);
    if (i === 0 && !st.closed) continue;
    if (st.closed) n++; else break;
  }
  return n;
}
function initialsOf(name) {
  const w = String(name).trim().split(/\s+/);
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : String(name).slice(0, 2)).toUpperCase();
}
function countsFor(dates) {
  const m = shiftMap();
  const out = {};
  dates.forEach(d => Object.values(m[d] || {}).forEach(s => {
    Object.values(s.items || {}).forEach(r => { if (r.done && r.by) out[r.by] = (out[r.by] || 0) + 1; });
  }));
  return out;
}
function weekDates() { return Array.from({ length: 7 }, (_, i) => daysAgo(i)); }

function prepItems() {
  const p = state.prepItems && state.prepItems.length ? state.prepItems : DEFAULT_PREP;
  return [...p].filter(x => x.active !== false).sort((a, b) => (a.order || 0) - (b.order || 0));
}
function parFor(item, dateStr) {
  const wd = weekdayOf(dateStr);
  const w = Number(item.parWeekend);
  return (wd >= 5 && !isNaN(w) && w > 0) ? w : (Number(item.par) || 0);
}
function prepStats(dateStr) {
  const rec = state.prepToday && state.prepToday.date === dateStr ? state.prepToday : null;
  const items = prepItems();
  let toMake = 0, done = 0, counted = 0;
  items.forEach(it => {
    const r = (rec && rec.items && rec.items[it.id]) || {};
    const par = parFor(it, dateStr);
    const have = r.have == null ? null : Number(r.have);
    const need = Math.max(0, par - (have || 0));
    if (have != null) counted++;
    if (r.done) done++;
    else if (need > 0) toMake++;
  });
  return { total: items.length, toMake, done, counted };
}
async function ensurePrep(dateStr) {
  const ref = state.db.doc('prep/' + dateStr);
  const snap = await ref.get();
  if (snap.exists) return { id: dateStr, ...snap.data() };
  const body = { date: dateStr, weekday: weekdayOf(dateStr), items: {}, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
  await ref.set(body);
  return { id: dateStr, ...body };
}
async function writePrep(itemId, patchFn) {
  const dateStr = ymd(new Date());
  const doc = await ensurePrep(dateStr);
  const rec = (doc.items && doc.items[itemId]) || {};
  const next = patchFn(rec);
  state.prepToday = { ...(state.prepToday || doc), items: { ...((state.prepToday || doc).items || {}), [itemId]: next } };
  render();
  try { await state.db.doc('prep/' + dateStr).update({ items: { [itemId]: next }, updatedAt: new Date().toISOString() }); }
  catch (e) { console.warn(e); toast('Nem sikerült menteni.'); }
}

/* ---------- Események ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-open]');
  if (!t) return;
  const d = t.dataset;
  if (t.classList.contains('tab')) { go({ tab: d.tab }); return; }
  if (t.id === 'whoBtn' || t.id === 'whoBtn2') { whoModal(); return; }
  if (d.open) { go({ tab: 'check', date: d.date, tplId: d.open }); return; }
  if ('back' in d) { go({ tab: state.route.from || 'today' }); return; }
  if (d.toggle) { toggleItem(d.toggle); return; }
  if (d.person) { itemPersonModal(d.person); return; }
  if ('owner' in d) { ownerModal(); return; }
  if (d.note) { noteModal(d.note); return; }
  if (d.photo) { photoModal(d.photo); return; }
  if ('sign' in d) { signModal(); return; }
  if (d.fixdone) { closeModal(); toggleItem(d.fixdone); return; }
  if (d.fixskip) { closeModal(); skipModal(d.fixskip); return; }
  if (d.delsig != null) {
    if (!confirm('Törlöd ezt az aláírást?')) return;
    const sigs = [...(state.openShift.signatures || [])]; sigs.splice(Number(d.delsig), 1);
    await patchShift(state.openShift.id, { signatures: sigs, closedAt: sigs.length ? state.openShift.closedAt : null }); return;
  }
  /* ellenőrzés */
  if ('auditStart' in d) { state.audit = { verdicts: {}, note: '' }; render(); return; }
  if ('auditCancel' in d) { state.audit = null; render(); return; }
  if ('auditSave' in d) {
    if (!Object.keys(state.audit.verdicts).length) { toast('Jelölj legalább egy feladatot.'); return; }
    auditSaveModal(); return;
  }
  if (d.verdict) {
    const [id, v] = d.verdict.split(':');
    if (v === 'bad') { verdictModal(id); return; }
    state.audit.verdicts[id] = { v: 'ok', c: '' }; render(); return;
  }
  if ('export' in d) { exportCsv(); return; }
  /* előkészítés és selejt */
  if ('prep' in d) { go({ tab: 'prep' }); return; }
  if ('waste' in d) { go({ tab: 'waste' }); return; }
  if (d.prepdone) {
    if (!state.who) { whoModal(); return; }
    const id = d.prepdone;
    writePrep(id, r => r.done ? { ...r, done: false, by: null, at: null } : { ...r, done: true, by: state.who, at: new Date().toISOString() });
    if (navigator.vibrate) { try { navigator.vibrate(14); } catch (e) {} }
    return;
  }
  if (d.preprec) {
    const [rid, need] = d.preprec.split(':');
    const rec = recipeById(rid);
    const y = rec && Number(rec.yieldQty) ? Number(rec.yieldQty) : 0;
    state.scale = y ? Math.max(0.25, Math.round((Number(need) / y) * 4) / 4) : 1;
    state.route = { tab: 'recipe', id: rid, from: 'prep' };
    window.scrollTo({ top: 0 }); render(); return;
  }
  if ('prepedit' in d) { go({ tab: 'prepEdit' }); return; }
  if ('prepeditCancel' in d) { state.editPrep = null; go({ tab: 'prep' }); return; }
  if (d.pestn) { const [i, st2] = d.pestn.split(':'); syncPrepEdit(); state.editPrep[Number(i)].station = st2; render(); return; }
  if (d.pedel != null && 'pedel' in d) {
    syncPrepEdit();
    if (!confirm('Törlöd ezt a tételt az előkészítési listáról?')) return;
    state.editPrep[Number(d.pedel)]._deleted = true;
    state.editPrep.splice(Number(d.pedel), 1); render(); return;
  }
  if ('peadd' in d) { syncPrepEdit(); state.editPrep.push({ id: 'p_' + uid().slice(0, 8), name: '', unit: 'g', par: null, parWeekend: null, station: 'Konyha', recipeId: '', order: (state.editPrep.length + 1) * 10 }); render(); return; }
  if ('pesave' in d) {
    syncPrepEdit();
    const keep = state.editPrep.filter(x => x.name && x.name.trim());
    const before = prepItems().map(x => x.id);
    const writes = keep.map((x, i) => ({ id: x.id, body: { name: x.name.trim(), unit: (x.unit || '').trim(), par: x.par, parWeekend: x.parWeekend, station: x.station || 'Konyha', recipeId: x.recipeId || '', order: (i + 1) * 10, sample: false, active: true, updatedAt: new Date().toISOString() } }));
    try {
      for (const w of writes) await state.db.doc('prepItems/' + w.id).set(w.body);
      for (const id of before) if (!keep.some(k => k.id === id)) await state.db.doc('prepItems/' + id).set({ active: false, name: '', order: 999, updatedAt: new Date().toISOString() });
      state.editPrep = null; go({ tab: 'prep' }); toast('Mentve.');
    } catch (err) { console.warn(err); toast(err && err.code === 'invalid_argument' ? 'Ehhez vezetői hozzáférés kell.' : 'Nem sikerült menteni.'); }
    return;
  }
  if ('wnew' in d) { wasteModal(); return; }
  if (d.wdel) {
    if (!confirm('Törlöd ezt a selejt bejegyzést?')) return;
    try { await state.db.doc('waste/' + d.wdel).delete(); toast('Törölve.'); } catch (e) { toast('Nem sikerült törölni.'); }
    return;
  }
  if (d.wphoto) {
    const w = state.waste.find(x => x.id === d.wphoto);
    if (!w || !w.photo) return;
    const url = photoUrl(w.photo);
    openModal(`<div class="lightbox">${url ? `<img src="${esc(url)}" alt="">` : '<p class="muted">Betöltés…</p>'}</div>
      <p class="small" style="margin:10px 0 0"><b>${esc(w.item)}</b> · ${esc(w.reason)}</p>
      <p class="small muted" style="margin:2px 0 12px">${esc(w.by || '')} · ${hhmm(w.at)}</p>
      <button class="btn ghost block" type="button" data-close2>Bezár</button>`,
      m => m.querySelector('[data-close2]').addEventListener('click', closeModal));
    return;
  }
  if ('wexport' in d) { exportWasteCsv(); return; }
  /* receptek */
  if (d.recipe) { go({ tab: 'recipe', id: d.recipe }); return; }
  if (d.reccat != null && 'reccat' in d) { state.recipeCat = d.reccat; render(); return; }
  if (d.scale) { state.scale = Number(d.scale); render(); return; }
  if ('recipeNew' in d) {
    state.editRecipe = { _new: true, id: 'r_' + uid().slice(0, 8), name: '', cat: RECIPE_CATS[0], yieldQty: 1, yieldUnit: 'adag', ingredients: [{ n: '', q: null, u: '' }], steps: [], allergens: [], note: '', order: 100 };
    go({ tab: 'recipeEdit' }); return;
  }
  if (d.recipeEdit) {
    const r = recipeById(d.recipeEdit);
    state.editRecipe = JSON.parse(JSON.stringify({ ...r, ingredients: r.ingredients || [], steps: r.steps || [], allergens: r.allergens || [] }));
    go({ tab: 'recipeEdit' }); return;
  }
  if ('recipeCancel' in d) { const id = state.editRecipe && !state.editRecipe._new ? state.editRecipe.id : null; state.editRecipe = null; go(id ? { tab: 'recipe', id } : { tab: 'recipes' }); return; }
  if (d.recat) { syncRecipeInputs(); state.editRecipe.cat = d.recat; render(); return; }
  if (d.realg) {
    syncRecipeInputs();
    const a = new Set(state.editRecipe.allergens || []);
    a.has(d.realg) ? a.delete(d.realg) : a.add(d.realg);
    state.editRecipe.allergens = [...a]; render(); return;
  }
  if ('ingAdd' in d) { syncRecipeInputs(); state.editRecipe.ingredients.push({ n: '', q: null, u: '' }); render(); return; }
  if (d.ingDel != null && 'ingDel' in d) { syncRecipeInputs(); state.editRecipe.ingredients.splice(Number(d.ingDel), 1); render(); return; }
  if ('recipeSave' in d) {
    syncRecipeInputs();
    const r = state.editRecipe;
    if (!r.name || !r.name.trim()) { toast('Adj nevet a receptnek.'); return; }
    const body = {
      name: r.name.trim(), cat: r.cat || '', yieldQty: isNaN(r.yieldQty) ? null : r.yieldQty, yieldUnit: (r.yieldUnit || '').trim(),
      ingredients: (r.ingredients || []).filter(i => i.n && i.n.trim()).map(i => ({ n: i.n.trim(), q: isNaN(i.q) ? null : i.q, u: (i.u || '').trim() })),
      steps: r.steps || [], allergens: r.allergens || [], note: (r.note || '').trim(),
      order: r.order || 100, photo: r.photo || null, sample: false, updatedAt: new Date().toISOString(),
    };
    try { await state.db.doc('recipes/' + r.id).set(body); const id = r.id; state.editRecipe = null; go({ tab: 'recipe', id }); toast('Recept mentve.'); }
    catch (err) { console.warn(err); toast(err && err.code === 'invalid_argument' ? 'Ehhez vezetői hozzáférés kell.' : 'Nem sikerült menteni.'); }
    return;
  }
  if ('recipeDel' in d) {
    if (!confirm('Biztosan törlöd ezt a receptet?')) return;
    try { await state.db.doc('recipes/' + state.editRecipe.id).delete(); state.editRecipe = null; go({ tab: 'recipes' }); toast('Recept törölve.'); }
    catch (err) { toast('Nem sikerült törölni.'); }
    return;
  }
  /* beállítások */
  if ('staffAdd' in d) {
    const v = $('#staffIn').value.trim();
    if (!v) return;
    if (staff().includes(v)) { toast('Ez a név már szerepel.'); return; }
    await saveSettings({ staff: [...staff(), v] }); return;
  }
  if (d.staffDel) { if (!confirm(`Törlöd: ${d.staffDel}?`)) return; await saveSettings({ staff: staff().filter(n => n !== d.staffDel) }); return; }
  if (d.tplMode) { const [ti, v] = d.tplMode.split(':').map(Number); syncTplInputs(); state.editTemplates[ti].perItem = !!v; render(); return; }
  if (d.tplReq) { const [ti, ii] = d.tplReq.split(':').map(Number); syncTplInputs(); const it = state.editTemplates[ti].items[ii]; it.required = !it.required; render(); return; }
  if (d.tplPho) { const [ti, ii] = d.tplPho.split(':').map(Number); syncTplInputs(); const it = state.editTemplates[ti].items[ii]; it.photo = !it.photo; render(); return; }
  if (d.tplDay) {
    const [ti, ii, day] = d.tplDay.split(':').map(Number);
    syncTplInputs();
    const it = state.editTemplates[ti].items[ii];
    const w = new Set(it.weekly || []); w.has(day) ? w.delete(day) : w.add(day);
    it.weekly = [...w].sort(); render(); return;
  }
  if (d.tplMove) {
    const [ti, ii, dir] = d.tplMove.split(':').map(Number);
    syncTplInputs();
    const arr = state.editTemplates[ti].items; const j = ii + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[ii], arr[j]] = [arr[j], arr[ii]]; render(); return;
  }
  if (d.tplDel) {
    const [ti, ii] = d.tplDel.split(':').map(Number);
    syncTplInputs();
    if (!confirm('Törlöd ezt a feladatot a sablonból?')) return;
    state.editTemplates[ti].items.splice(ii, 1); render(); return;
  }
  if (d.tplAdd != null) {
    syncTplInputs();
    state.editTemplates[Number(d.tplAdd)].items.push({ id: 'x' + uid().slice(0, 8), text: '', weekly: [] }); render();
    const areas = document.querySelectorAll(`[data-tpl-text^="${d.tplAdd}:"]`); const last = areas[areas.length - 1]; if (last) last.focus();
    return;
  }
  if (d.tplSave != null) {
    syncTplInputs();
    const tpl = state.editTemplates[Number(d.tplSave)];
    tpl.items = tpl.items.filter(it => it.text.trim());
    const body = {
      name: tpl.name, section: tpl.section, order: tpl.order, perItem: !!tpl.perItem, dueBy: (tpl.dueBy || '').trim(),
      items: tpl.items.map(it => ({ id: it.id, text: it.text.trim(), weekly: it.weekly && it.weekly.length ? it.weekly : [], required: !!it.required, photo: !!it.photo })),
      updatedAt: new Date().toISOString(),
    };
    try { await state.db.doc('templates/' + tpl.id).set(body); toast('Sablon mentve.'); }
    catch (err) { console.warn(err); toast(err && err.code === 'invalid_argument' ? 'Ehhez vezetői (szerkesztési) hozzáférés kell.' : 'Nem sikerült menteni.'); }
    return;
  }
});
document.addEventListener('change', e => {
  const inp = e.target;
  if (inp.dataset && inp.dataset.have) {
    const v = parseFloat(String(inp.value).replace(',', '.'));
    writePrep(inp.dataset.have, r => ({ ...r, have: isNaN(v) ? null : v, countedBy: state.who || r.countedBy || null, countedAt: new Date().toISOString() }));
    return;
  }
  if (inp.id === 'wPhoto') {
    const f = inp.files && inp.files[0]; inp.value = '';
    if (!f) return;
    const lbl = document.getElementById('wPhotoLbl'); if (lbl) lbl.textContent = 'Feltöltés…';
    storePhoto(f, { kind: 'waste' }).then(ref => { state._wastePhoto = ref; if (lbl) lbl.textContent = 'Fotó kész ✓'; })
      .catch(() => { if (lbl) lbl.textContent = 'Nem sikerült'; });
    return;
  }
  if (inp.dataset && inp.dataset.cam) { const f = inp.files && inp.files[0]; inp.value = ''; onPhoto(inp.dataset.cam, f); }
  if (inp.id === 'rePhoto') {
    const f = inp.files && inp.files[0]; inp.value = '';
    if (!f || !state.editRecipe) return;
    syncRecipeInputs(); toast('Fotó feltöltése…');
    storePhoto(f, { recipeId: state.editRecipe.id }).then(ref => { state.editRecipe.photo = ref; render(); toast('Fotó hozzáadva.'); })
      .catch(() => toast('Nem sikerült a fotó mentése.'));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function syncTplInputs() {
  if (!state.editTemplates) return;
  document.querySelectorAll('[data-tpl-text]').forEach(a => { const [ti, ii] = a.dataset.tplText.split(':').map(Number); const it = state.editTemplates[ti] && state.editTemplates[ti].items[ii]; if (it) it.text = a.value; });
  document.querySelectorAll('[data-tpl-due]').forEach(a => { const ti = Number(a.dataset.tplDue); if (state.editTemplates[ti]) state.editTemplates[ti].dueBy = a.value; });
}
async function saveSettings(patch) {
  const ref = state.db.doc('settings/app');
  try {
    const cur = await ref.get();
    await ref.set({ ...(cur.exists ? cur.data() : { staff: [] }), ...patch, updatedAt: new Date().toISOString() });
  } catch (err) { console.warn(err); toast(err && err.code === 'invalid_argument' ? 'Ehhez vezetői (szerkesztési) hozzáférés kell.' : 'Nem sikerült menteni.'); }
}

setInterval(() => { const t = ymd(new Date()); if (t !== state._day) { state._day = t; subscribeToday(); render(); } }, 60000);

render();
initStore();
})();

</script>
